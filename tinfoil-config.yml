# Separate candidate only. Production and Vita remain on their existing releases.
# Validated source 40ed2611bc8f477cce0a3e64628c2a0e4d719a5f; Actions 36751136808.
# Exact learned weights use a verified read-only model disk; candidate remains at 8 GiB.
cvm-version: 0.14.7
cpus: 4
memory: 8192
models:
  - name: jev-learned
    repo: alexdobrin/open-jev-r8-v4-candidate-20260930@0f3a747adc8b497ea46b503f968ba1aef1a8e6bc
    mpk: b3dd8bf34a654341c6cce57ae9cec79e64d05a9e0c049e092a7862c9057f87bd_1141026816_ad1dfdbc-aca7-5769-8b85-cc67814e5ccc
containers:
  - name: open-jev-candidate
    image: ghcr.io/vitadao/open-jev-tinfoil@sha256:3541c5ca189f227eed456f7f8a9872ab8f7b2369a82b76b8a4b0345f7133ea18
    models:
      - jev-learned
    env:
      - OMP_NUM_THREADS: "4"
      - MKL_NUM_THREADS: "4"
      - ENABLE_EXPERIMENTAL_SELECTOR: "1"
    secrets:
      - OPEN_JEV_CANDIDATE_API_KEY
    tmpfs:
      /tmp: rw,noexec,nosuid,nodev,size=64m,mode=1777
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
shim:
  upstream-port: 8080
  paths:
    - /health
    - /decide
    - /route
    - /v1/select
# Closed outbound network; no debug mode or automatic updates.
