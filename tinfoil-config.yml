# Separate candidate only. Production and Vita remain on their existing releases.
# Validated source c481b9448cd7d610b840cf25eef63b04b1fb5e82; Actions 36731266178.
# Candidate allocation reduced to 8 GiB at owner request; startup acceptance required.
cvm-version: 0.14.7
cpus: 4
memory: 8192
containers:
  - name: open-jev-candidate
    image: ghcr.io/vitadao/open-jev-tinfoil@sha256:94d87c7275818ec783d3ee6dc246ad40708cdeb1f11b952ba29596dc36ea5fa1
    env:
      - OMP_NUM_THREADS: "4"
      - MKL_NUM_THREADS: "4"
      - ENABLE_EXPERIMENTAL_SELECTOR: "1"
    secrets:
      - OPEN_JEV_CANDIDATE_API_KEY
    tmpfs:
      /tmp: rw,noexec,nosuid,nodev,size=64m,mode=1777
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
shim:
  upstream-port: 8080
  paths:
    - /health
    - /decide
    - /route
    - /v1/select
# Closed outbound network; no debug mode or automatic updates.
