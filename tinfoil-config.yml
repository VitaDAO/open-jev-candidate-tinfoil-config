# Candidate-only authentication release; production remains on its existing release.
# Auth source 7b95597; validated image and selector identity Actions 37455401060.
# Exact learned weights use a verified read-only model disk; candidate remains at 8 GiB.
cvm-version: 0.14.7
cpus: 4
memory: 8192
models:
  - name: jev-learned
    repo: alexdobrin/open-jev-r8-v4-candidate-20260930@0f3a747adc8b497ea46b503f968ba1aef1a8e6bc
    mpk: b3dd8bf34a654341c6cce57ae9cec79e64d05a9e0c049e092a7862c9057f87bd_1141026816_ad1dfdbc-aca7-5769-8b85-cc67814e5ccc
containers:
  - name: open-jev-candidate
    image: ghcr.io/vitadao/open-jev-tinfoil@sha256:98c96295a0e44ad574a91380b4b76dd23759d255c94042f770c0e1632c8c66b7
    models:
      - jev-learned
    env:
      - OMP_NUM_THREADS: "4"
      - MKL_NUM_THREADS: "4"
      - ENABLE_EXPERIMENTAL_SELECTOR: "1"
      - OPEN_JEV_AUTH_MODE: "tinfoil"
    tmpfs:
      /tmp: rw,noexec,nosuid,nodev,size=64m,mode=1777
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
shim:
  upstream-port: 8080
  authenticated: true
  authenticated-endpoints:
    - /decide
    - /route
    - /v1/select
  origins:
    - http://localhost:8080
    - http://127.0.0.1:8080
    - https://vita-agent-prod.vitality-now.containers.tinfoil.dev
    - https://staging-vita-agent.debug.vitality-now.containers.tinfoil.dev
  paths:
    - /health
    - /decide
    - /route
    - /v1/select
# Closed outbound network; no debug mode or automatic updates.
