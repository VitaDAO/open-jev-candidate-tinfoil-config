# Separate candidate only. Production and Vita remain on their existing releases.
# Validated source e0eb8248c5b9d09444106b4a795c9d929042d0ca; Actions 36735099774.
# Exact learned weights use a verified read-only model disk; candidate remains at 8 GiB.
cvm-version: 0.14.7
cpus: 4
memory: 8192
models:
  - name: jev-learned
    repo: alexdobrin/open-jev-r8-v4-candidate-20260930@0f3a747adc8b497ea46b503f968ba1aef1a8e6bc
    mpk: b3dd8bf34a654341c6cce57ae9cec79e64d05a9e0c049e092a7862c9057f87bd_1141026816_ad1dfdbc-aca7-5769-8b85-cc67814e5ccc
containers:
  - name: open-jev-candidate
    image: ghcr.io/vitadao/open-jev-tinfoil@sha256:09feadd39a072a20cd4da3220e53ca036b9756a541bce854238b8d587273a88d
    models:
      - jev-learned
    env:
      - OMP_NUM_THREADS: "4"
      - MKL_NUM_THREADS: "4"
      - ENABLE_EXPERIMENTAL_SELECTOR: "1"
    secrets:
      - OPEN_JEV_CANDIDATE_API_KEY
    tmpfs:
      /tmp: rw,noexec,nosuid,nodev,size=64m,mode=1777
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
shim:
  upstream-port: 8080
  paths:
    - /health
    - /decide
    - /route
    - /v1/select
# Closed outbound network; no debug mode or automatic updates.
